<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก - UniFind DPU</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="wrap">
    <div class="auth wide">
      <div class="auth-side">
        <h2>สมัครไว้ ของหายเมื่อไหร่จะได้ไม่ลน</h2>
        <p class="big">เบอร์โทรกับ Line ของเธอถูกเข้ารหัสไว้ คนอื่นเห็นได้ก็ต่อเมื่อตอบคำถามลับผ่าน และเป็นคู่ที่แมตช์กับเธอจริง ๆ เท่านั้น</p>
        <span class="sticker">สำหรับนักศึกษาและบุคลากร DPU</span>
      </div>
      <div class="auth-form">
        <h1>สมัครสมาชิก</h1>
        <form id="register-form" novalidate class="mt">
          <div class="grid grid-2">
            <div class="field">
              <label for="studentId">รหัสนักศึกษา/บุคลากร <span class="req">*</span></label>
              <input type="text" id="studentId" name="studentId" inputmode="numeric" maxlength="12" placeholder="65130001" required>
            </div>
            <div class="field">
              <label for="email">อีเมล DPU <span class="req">*</span></label>
              <input type="email" id="email" name="email" maxlength="120" placeholder="ชื่อ@dpu.ac.th" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="firstName">ชื่อ <span class="req">*</span></label>
              <input type="text" id="firstName" name="firstName" maxlength="60" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label for="lastName">นามสกุล <span class="req">*</span></label>
              <input type="text" id="lastName" name="lastName" maxlength="60" autocomplete="family-name" required>
            </div>
            <div class="field">
              <label for="phone">เบอร์โทร <span class="req">*</span></label>
              <input type="tel" id="phone" name="phone" maxlength="12" placeholder="0891234567" autocomplete="tel" required>
            </div>
            <div class="field">
              <label for="lineId">Line ID (ไม่ใส่ก็ได้)</label>
              <input type="text" id="lineId" name="lineId" maxlength="40">
            </div>
            <div class="field">
              <label for="password">รหัสผ่าน <span class="req">*</span></label>
              <input type="password" id="password" name="password" maxlength="72" autocomplete="new-password" required>
              <div class="pw-meter"><span id="pw-bar"></span></div>
              <div class="hint">8 ตัวขึ้นไป มีพิมพ์ใหญ่ พิมพ์เล็ก ตัวเลข และสัญลักษณ์</div>
            </div>
            <div class="field">
              <label for="confirmPassword">พิมพ์รหัสผ่านอีกครั้ง <span class="req">*</span></label>
              <input type="password" id="confirmPassword" name="confirmPassword" maxlength="72" autocomplete="new-password" required>
            </div>
          </div>
          <label class="check"><input type="checkbox" id="consent" required>
            <span>ยินยอมให้เก็บข้อมูลส่วนตัวไว้ใช้ติดต่อคืนของภายในมหาวิทยาลัย ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล (PDPA)</span></label>
          <div class="note danger hidden mt" id="error" role="alert"></div>
          <button class="btn btn-grape btn-block btn-lg mt" type="submit" id="submit">สร้างบัญชี</button>
        </form>
        <p class="center mt small">มีบัญชีแล้ว <a href="/login.html">เข้าสู่ระบบ</a></p>
      </div>
    </div>
  </main>
  <div id="toast-root" aria-live="polite"></div>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
